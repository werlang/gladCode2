services:
    runner:
        build:
            context: .
            dockerfile: Dockerfile-dind
        restart: unless-stopped
        volumes:
            - ./runner:/app
            - node_modules:/app/node_modules
            - /var/run/docker.sock:/var/run/docker.sock
            - ./data/runs:/requests
            - runs:/runs
        ports:
            - 127.0.0.1:${RUNNER_PORT:-3000}:3000
        environment:
            - MYSQL_HOST=mysql
            - MYSQL_PORT=${MYSQL_PORT}
            - MYSQL_USER=root
            - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
        # Deterministic install at startup: ./runner bind-mount shadows
        # build-time node_modules and the named volume starts empty (or
        # half-written after a crashed install) on fresh checkouts.
        # Always `npm ci` — a shortcut `[ -x ... ]` check can perpetually
        # preserve a corrupt tree combined with the restart loop.
        command: sh -c "npm ci --no-audit --no-fund && exec npm run dev"
        # command: tail -f /dev/null #idle container

    web:
        build:
            context: ./web
            target: development
        restart: unless-stopped
        volumes:
            - ./web:/app
            - web_node_modules:/app/node_modules
            - ./data/profpics:/data/profpics:ro
        environment:
            - NODE_ENV=${NODE_ENV:-production}
            - PROFPICS_DIR=/data/profpics
            - API_URL=${API_URL:-http://localhost}
            - API_PORT=${API_PORT:-3001}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - ENABLE_RENDER2=${ENABLE_RENDER2:-1}
            - MAINTENANCE=${MAINTENANCE:-}
            - TRUST_PROXY=${TRUST_PROXY:-false}
        ports:
            - "${WEB_PORT:-80}:3000"
        command: sh -c "npm ci --no-audit --no-fund && exec npm run development"
        depends_on:
            - api
        logging:
            options:
                max-size: "10m"

    api:
        build:
            context: ./api
            target: development
        restart: unless-stopped
        volumes:
            - ./api:/app
            - api_node_modules:/app/node_modules
            - ./data/profpics:/data/profpics
            - ./data/logs:/data/logs
            - ./data/runs:/data/runs
            - ./Payload:/payload:ro
        environment:
            - NODE_ENV=${NODE_ENV:-production}
            - PROFPICS_DIR=/data/profpics
            - LOGS_DIR=/data/logs
            - RUNS_DIR=/data/runs
            - PAYLOAD_DIR=/payload
            - RUNNER_URL=http://runner:3000
            - MYSQL_HOST=mysql
            - MYSQL_PORT=3306
            - MYSQL_USER=root
            - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - WEB_URL=${WEB_URL:-http://localhost}
            - WEB_PORT=${WEB_PORT:-80}
            - JWT_SECRET=${JWT_SECRET:-}
            - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - ADMIN_EMAILS=${ADMIN_EMAILS:-}
            - TRUST_PROXY=${TRUST_PROXY:-false}
            - MAILER_HOST=${MAILER_HOST:-email-smtp.us-east-1.amazonaws.com}
            - MAILER_PORT=${MAILER_PORT:-587}
            - MAILER_USER=${MAILER_USER:-}
            - MAILER_PASSWORD=${MAILER_PASSWORD:-}
        ports:
            - "${API_PORT:-3001}:3000"
        command: sh -c "npm ci --no-audit --no-fund && exec npm run development"
        depends_on:
            - mysql
        logging:
            options:
                max-size: "10m"

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            - TZ=America/Sao_Paulo
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        volumes:
            - mysql:/var/lib/mysql
            - .:/app
        ports:
            - 127.0.0.1:${MYSQL_PORT}:3306
volumes:
    node_modules:
    api_node_modules:
    web_node_modules:
    mysql:
    runs:
        name: gladcode_tmp_run