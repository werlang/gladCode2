services:
    apache:
        build:
            context: .
            dockerfile: Dockerfile-apache
        restart: unless-stopped
        volumes:
            - ./public_html:/var/www/html
            - ./Payload:/app/payload
        ports:
            - 80:80
        logging:
            options:
                max-size: "10m"
    runner:
        build:
            context: .
            dockerfile: Dockerfile-dind
        restart: unless-stopped
        volumes:
            - ./runner:/app
            - node_modules:/app/node_modules
            - /var/run/docker.sock:/var/run/docker.sock
            - ./public_html/runs:/phppayload
            - runs:/runs
        ports:
            - 127.0.0.1:3000:3000
        environment:
            - MYSQL_HOST=mysql
            - MYSQL_PORT=${MYSQL_PORT}
            - MYSQL_USER=root
            - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
        command: npm run dev
        # command: tail -f /dev/null #idle container

    migrate:
        build:
            context: .
            dockerfile: Dockerfile-migrate
        environment:
            - MYSQL_HOST=mysql
            - MYSQL_PORT=${MYSQL_PORT}
            - MYSQL_USER=root
            - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"
        profiles:
            - tools

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            - TZ=America/Sao_Paulo
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 15s
        volumes:
            - mysql:/var/lib/mysql
            - .:/app
        ports:
            - 127.0.0.1:${MYSQL_PORT}:3306
volumes:
    node_modules:
    mysql:
    runs:
        name: gladcode_tmp_run