services:
    apache:
        build:
            context: .
            dockerfile: Dockerfile-apache
        restart: unless-stopped
        volumes:
            - ./public_html:/var/www/html
            - ./payload:/app/payload
        ports:
            - 80:80

    runner:
        build:
            context: .
            dockerfile: Dockerfile-dind
        restart: unless-stopped
        volumes:
            - ./runner:/app
            - node_modules:/app/node_modules
            - /var/run/docker.sock:/var/run/docker.sock
            - ./public_html/runs:/phppayload
            - runs:/runs
        ports:
            - 3000:3000
        command: npm run dev
        # command: tail -f /dev/null #idle container

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        volumes:
            - mysql:/var/lib/mysql
            - .:/app
        ports:
            - 127.0.0.1:${MYSQL_PORT}:3306

    nginx:
        image: pswerlang/nginx-auto-ssl
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx:/etc/nginx/conf.d
        environment:
            - SITES=api.gladcode.localhost=node:3000;gladcode.localhost=apache
            - ALLOWED_DOMAINS=gladcode.dev
            - FORCE_HTTPS=true
volumes:
    node_modules:
    mysql:
    runs:
        name: gladcode_tmp_run