<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8' />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{> head}}
	<link rel="icon" type="image/gif" href="icon/gladcode_icon.png" />
	<title>gladCode - Obrigado</title>
	<link type='text/css' rel='stylesheet' href="{{#asset}}css/header.css{{/asset}}"/>
	{{{importMap}}}
	<script type="module" src="{{#module}}header.js{{/module}}"></script>

	<style>
		body{
			margin: 0;
			background-color: var(--color-page);
			font-family: 'Source Code Pro', monospace;
			font-size: 16px;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			height: 100vh;
		}

		#frame {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding-top: 50px;
			flex-grow: 1;
		}
		#content-box {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			background-color: var(--color-surface);
			box-shadow: var(--shadow-md);
			border-radius: 0px;
			padding: 20px 15px;
			z-index: 1;
			width: 900px;
			max-width: 100%;
			box-sizing: border-box;
			font-family: 'Roboto', sans-serif;
			color: var(--color-text);
			justify-content: center;
			height: 300px;
		}
		h2, h3 {
			margin-left: 20px;
		}
		#footer-wrapper {
			position: relative;
		}
	</style>
	<script type="module">
		// counts down, then goes to the news
		const counter = document.querySelector('#content-box span');
		const timer = setInterval(() => {
			counter.textContent = Number(counter.textContent) - 1;
			if (Number(counter.textContent) <= 0) {
				clearInterval(timer);
				location.href = 'news';
			}
		}, 1000);
	</script>
</head>
<body>
    {{{templateVars}}}
    {{> header}}
	<div id='frame'>
        <div id='content-box'>
            <h2>A gladCode agradece seu apoio.</h2>
            <h3>Você será redirecionado em <span>10</span> segundos.</h2>
        </div>
	</div>
</body>
</html>
