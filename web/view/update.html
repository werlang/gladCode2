<!DOCTYPE html>


<html>
<head>
	<meta charset='utf-8' />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/gif" href="icon/gladcode_icon.png" />
	<title>gladCode - Atualização</title>
	<link href="https://fonts.googleapis.com/css?family=Roboto|Source+Code+Pro&display=swap" rel="stylesheet">
	<link type='text/css' rel='stylesheet' href='css/update.css'/> 
	<link type='text/css' rel='stylesheet' href='css/dialog.css'/> 
	<link type='text/css' rel='stylesheet' href='css/header.css'/> 
	{{{importMap}}}
	<script type="module" src="{{#module}}header.js{{/module}}"></script>
	<script type="module" src="{{#module}}update.js{{/module}}"></script>
	
</head>
<body>
    {{{templateVars}}}
	{{> header}}
	<div id='frame'>
		<div id='content-box'>
			<div id='version'>
				<div>Versão atual: <span id='current'></span></div>
				<p class='hint'>A versão é o arquivo <code>api/version</code>: altere-o num commit e publique a API.</p>
			</div>
			<div id='gladiators'>
				<p>Gladiadores por versão</p>
				<div class='list'></div>
			</div>
			<div id='changes'>
				<p>Sumário de mudanças</p>
				<textarea></textarea>
			</div>
			<div id='postlink'>
				<p>Link para o post completo</p>
				<input type='url' placeholder='https://gladcode.dev/post/...'>
			</div>
			<button id='send' class='button'>Enviar anúncio por e-mail</button>
		</div>
	</div>
	<div id='footer'>{{> footer}}</div>

</body>
</html>
