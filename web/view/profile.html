<body>
    {{{templateVars}}}
    {{> header}}
    <a class='painel-skip' href='#painel-content'>Pular para o conteúdo</a>
    <div id='painel'>
        <aside id='painel-menu' class='painel-menu' aria-label='Painel'></aside>
        <main id='painel-content'>
            <div id='panel'>
            <div class='content' data-menu='news'><div id='news-container'><p class='news-loading'>Carregando notícias…</p></div></div>
            <div class='content' data-menu='profile'><div id='profile-panel'></div></div>
            <div class='content' data-menu='battle'><div id='battle-container'><p class='news-loading'>Carregando batalhas…</p></div></div>
            <div class='content' data-menu='report'><div id='report-container'><p class='news-loading'>Carregando relatórios…</p></div></div>
            <div class='content' data-menu='glads'><div id='glads-container'><p class='news-loading'>Carregando gladiadores…</p></div></div>
            <div class='content' data-menu='potions'><div id='apot-container'><p class='news-loading'>Carregando poções…</p></div></div>
            <div class='content' data-menu='ranking'><div id='ranking-container'><p class='news-loading'>Carregando ranking…</p></div></div>
            <div class='content' data-menu='messages'><div id='messages-container'><p class='news-loading'>Carregando mensagens…</p></div></div>
            <div class='content' data-menu='friends'><div id='friends-container'><p class='news-loading'>Carregando amigos…</p></div></div>
        </div>
        </main>
    </div>
    <nav id='painel-tabs' class='mobile-tab-bar' aria-label='Seções'></nav>
    <div id='painel-more'></div>
</body>
