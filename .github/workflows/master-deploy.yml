name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          REPO_PATH: ${{ vars.REPO_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REPO_PATH
          script: |
            set -e
            cd ${{ vars.REPO_PATH }}
            echo "[Deploy] Starting deployment to path: ${{ vars.REPO_PATH }}"
            echo "[Deploy] Fetching latest changes..."
            git fetch origin --prune
            git checkout main
            git reset --hard origin/main
            echo "[Deploy] Code synchronized with origin/main."
            echo "[Deploy] Checking the settings the services need..."
            # without them the API refuses to start or the web service binds the host's port 80
            for key in JWT_SECRET WEB_PUBLISH API_PUBLISH; do
                if ! grep -q "^${key}=." .env; then
                    echo "[Deploy] error: set ${key} in .env first (see .env.example)." >&2
                    exit 1
                fi
            done
            echo "[Deploy] Moving the PHP stack's battle logs and profile pictures into data/ (once, never overwriting)..."
            mkdir -p data/logs data/profpics data/runs
            for dir in logs profpics; do
                if [ -d "public_html/$dir" ]; then
                    # some coreutils versions exit 1 when -n skips a file: that must not stop the deploy
                    find "public_html/$dir" -mindepth 1 -maxdepth 1 -exec mv -n -t "data/$dir" {} + || true
                    left=$(find "public_html/$dir" -mindepth 1 -maxdepth 1 | wc -l)
                    if [ "$left" -gt 0 ]; then
                        echo "[Deploy] warning: $left entries of public_html/$dir already exist in data/$dir and were left in place."
                    fi
                fi
            done
            echo "[Deploy] Building images..."
            docker compose build
            # the engine image the runner starts per battle (gcc, Python and Node for the gladiators);
            # cached layers make this quick when Setup/ did not change
            docker build -t gladcode2-vm Setup
            echo "[Deploy] Running database migrations in a one-shot container..."
            # before the new code starts, so it never runs against the old schema
            docker compose up -d mysql
            ./migrations/migrate.sh
            echo "[Deploy] Restarting services..."
            # --remove-orphans drops services that left compose.yaml (the PHP stack's apache)
            docker compose up -d --force-recreate --remove-orphans
            echo "[Deploy] Services restarted successfully."
      - name: Notify success
        if: success()
        run: echo "[Deploy] Deployment successful! Services restarted and assets recompiled."

      - name: Notify failure
        if: failure()
        run: echo "[Deploy] Deployment failed! Please check the logs for details."