services:
    backup: 
        build: .
        env_file:
            - ../.env
        volumes:
            - .:/app
            - node_modules:/app/node_modules
        networks:
            - gladcode
        working_dir: /app
        command: "npm start"
volumes:
    node_modules:
networks:
    gladcode:
        name: gladcode_default
        external: true