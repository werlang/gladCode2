# Local development on top of compose.yaml: the web, api and runner services run from the source
# folders with live reload (`node --watch`) instead of their production images. Select it in your
# .env:
#   COMPOSE_FILE=compose.yaml:compose.dev.yaml
services:
    runner:
        build:
            target: development
        volumes:
            - ./runner:/app
            - runner_node_modules:/app/node_modules
        # published on this machine only, to call the runner by hand while debugging
        ports:
            - 127.0.0.1:${RUNNER_PORT:-3000}:3000
        command: sh -c "npm ci --no-audit --no-fund && exec npm run development"

    web:
        build:
            target: development
        volumes:
            - ./web:/app
            - web_node_modules:/app/node_modules
        command: sh -c "npm ci --no-audit --no-fund && exec npm run development"

    api:
        build:
            target: development
        volumes:
            - ./api:/app
            - api_node_modules:/app/node_modules
        command: sh -c "npm ci --no-audit --no-fund && exec npm run development"

    mysql:
        # published on this machine only, for database tools; the services use the compose network
        ports:
            - 127.0.0.1:${MYSQL_PORT:-3306}:3306

volumes:
    api_node_modules:
    runner_node_modules:
    web_node_modules:
