<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/" />
    <title>gladCode - render2 harness</title>
    <script src="script/battle-renderer-preference.js"></script>
    <link rel='stylesheet' href="css/playback.css"/>
    <link rel='stylesheet' href="css/playback-render2.css"/>
    <script src='https://code.jquery.com/jquery-3.4.1.min.js'></script>
    <script src='https://code.jquery.com/ui/1.12.1/jquery-ui.min.js'></script>
    <style>
        body { margin: 0; background: #15191d; }
        #frame { width: 100vw; height: 100vh; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
            }
        }
    </script>
</head>
<body class="renderer-three">
    <div id="frame">
        <div id="canvas-container">
            <div id="canvas-div"></div>
        </div>
    </div>
    <script>
        // Minimal stand-ins for the shared playback environment.
        window.prefs = { bars: true, speech: true, text: true, fps: false, crowd: 0.65, sound: { music: 0, sfx: 0 } };
        window.pausesim = true;
        window.stepIncrement = 1;
        window.update_ui = () => {};
        window.sprite = [];
        window.gladArray = [];
    </script>
    <script type="module">
        const ACTIONS = { fireball: 0, teleport: 1, charge: 2, block: 3, assassinate: 4, ambush: 5, melee: 6, ranged: 7, movement: 8, waiting: 9, none: 10, potion: 11 };

        const EMPTY_BUFFS = () => ({
            burn: { value: 0, timeleft: 0 },
            movement: { value: 0, timeleft: 0 },
            resist: { value: 0, timeleft: 0 },
            invisible: { value: 0, timeleft: 0 },
            stun: { value: 0, timeleft: 0 },
        });

        function gladiator(id, name, user, skin, x, y, head) {
            return {
                id, name, user, skin,
                x, y, head,
                hp: 100, maxhp: 100, ap: 60, maxap: 60,
                lvl: 1, xp: 0, tonext: 100,
                STR: 10, AGI: 10, INT: 10, as: 1, cs: 1, spd: 3,
                lockedfor: 0, action: ACTIONS.none, code: '', message: '',
                breakpoint: '', items: [1, -1],
                buffs: EMPTY_BUFFS(),
            };
        }

        /**
         * Deterministic 32-second skirmish exercising every clip, projectile
         * type, buff, event, a poison shrink and a death — no backend needed.
         */
        function buildSimulation() {
            const frames = [];
            const totalFrames = 320;
            let glad0 = gladiator(0, 'Aurelia', 'Team#Gold', '["female","tanned","plate_gold","sword","helm_iron","cape_red"]', 4, 4, 45);
            let glad1 = gladiator(1, 'Kaelin', 'Team#Silver', '["male","dark","leather","bow","hair_black"]', 21, 21, 225);
            let nextProjectileId = 1;
            let projectiles = [];
            let fireballCooldown = 0;

            for (let step = 0; step < totalFrames; step += 1) {
                const time = Number((step * 0.1).toFixed(1));

                if (time >= 26 && glad1.hp > 0 && time < 26.2) {
                    glad1 = { ...glad1, hp: 0 };
                }
                else if (time > 20 && time <= 24 && glad0.hp > 90) {
                    glad0 = { ...glad0, hp: Math.max(70, glad0.hp - 1.5) }; // sustained damage -> floating numbers
                }
                if (time === 14.5) glad0 = { ...glad0, lvl: 2, xp: 120 };

                // Kiter circles the arena while firing.
                const angle = time * 0.55;
                glad1 = {
                    ...glad1,
                    x: 12.5 + Math.cos(angle) * 7.5,
                    y: 12.5 + Math.sin(angle) * 7.5,
                    head: Number((angle * 180 / Math.PI + 180) % 360),
                    action: ACTIONS.movement,
                };

                // Bruiser marches in, swings, blocks, charges again.
                if (time < 6) {
                    glad0 = { ...glad0, x: 4 + time * 1.4, y: 4 + time * 1.05, head: 45, action: ACTIONS.movement };
                }
                else if (time < 9) {
                    glad0 = { ...glad0, action: time % 1.6 < 0.9 ? ACTIONS.melee : ACTIONS.movement, x: 12.4 + (time - 6) * 0.2, y: 10.3 };
                }
                else if (time < 11) glad0 = { ...glad0, action: ACTIONS.block };
                else if (time < 13) glad0 = { ...glad0, action: ACTIONS.charge, x: 12.6 + (time - 11) * 2.2, y: 10.2 };
                else if (time < 15) glad0 = { ...glad0, action: ACTIONS.melee, x: 16.9, y: 10.2 };
                else if (time < 17) glad0 = { ...glad0, action: ACTIONS.waiting, x: 16.9, y: 10.2 };
                else if (time < 19) glad0 = { ...glad0, action: ACTIONS.teleport, x: 8, y: 18 };
                else if (time < 21) glad0 = { ...glad0, action: ACTIONS.ambush, x: 8, y: 18 };
                else if (time < 23) glad0 = { ...glad0, action: ACTIONS.fireball, x: 8, y: 18, ap: 30 };
                else if (time < 25) glad0 = { ...glad0, action: ACTIONS.potion, x: 8, y: 18, hp: Math.min(100, glad0.hp + 1.2) };
                else glad0 = { ...glad0, action: ACTIONS.movement, x: 8 + (time - 25) * 1.6, y: 18 - (time - 25) * 0.8 };

                // Buff choreography.
                const buffs = EMPTY_BUFFS();
                if (time >= 8 && time < 12) buffs.resist = { value: 0.5, timeleft: 12 - time };
                if (time >= 15 && time < 20) buffs.burn = { value: 3, timeleft: 20 - time };
                if (time >= 19 && time < 21.5) buffs.stun = { value: 1, timeleft: 21.5 - time };
                if (time >= 22 && time < 24) buffs.invisible = { value: 1, timeleft: 24 - time };

                // Arrows stream from the kiter toward the bruiser.
                if (step % 12 === 4 && time > 2 && time < 24) {
                    projectiles.push({ id: nextProjectileId++, type: 0, owner: 1, x: glad1.x, y: glad1.y, head: glad1.head });
                }
                if (time >= 23 && fireballCooldown === 0) {
                    projectiles.push({ id: nextProjectileId++, type: 1, owner: 0, x: glad0.x, y: glad0.y, head: 315 });
                    fireballCooldown = 1;
                }
                projectiles = projectiles.map((projectile) => {
                    const speed = projectile.type === 1 ? 6 : 9;
                    const radians = (projectile.head) * Math.PI / 180;
                    return {
                        ...projectile,
                        x: projectile.x + Math.sin(radians) * speed * 0.1,
                        y: projectile.y - Math.cos(radians) * speed * 0.1,
                    };
                }).filter((projectile) => {
                    const distance = Math.hypot(projectile.x - 12.5, projectile.y - 12.5);
                    return distance < 11.5;
                });

                glad0 = { ...glad0, buffs: structuredClone(buffs) };
                glad1 = { ...glad1, message: time === 5 ? 'Coward!' : '' };

                frames.push({
                    simtime: time,
                    poison: Math.max(5.5, 17.68 - Math.max(0, time - 15) * 0.75),
                    glads: [
                        JSON.parse(JSON.stringify(glad0)),
                        JSON.parse(JSON.stringify(glad1)),
                    ],
                    projectiles: JSON.parse(JSON.stringify(projectiles.map(({ owner, ...rest }) => rest))),
                });
            }
            return frames;
        }

        async function main() {
            const status = document.createElement('div');
            status.id = 'harness-status';
            Object.assign(status.style, { position: 'fixed', top: '8px', right: '8px', zIndex: 99, color: '#f4f1e7', font: '600 13px monospace', background: 'rgb(0 0 0 / .55)', padding: '6px 10px', borderRadius: '8px' });
            document.body.appendChild(status);
            status.textContent = 'Loading modules';

            const params = new URLSearchParams(location.search);
            // Freeze playback at a chosen frame for screenshots: ?t=7.5
            const tParam = params.get('t');
            const freezeAt = tParam === null ? NaN : Number(tParam);
            const probe = params.get('probe');

            // Cache-bust the entire module graph so edits show up instantly.
            const V = String(Date.now());
            const [THREE, { FBXLoader }, SkeletonUtils, { RoomEnvironment }, { expandSimulation }, { ThreeBattleRenderer }, { SyntyHeroAssets }, { SyntyAnimationLibrary }, { SyntyPropAssets }] = await Promise.all([
                import('three'),
                import('three/addons/loaders/FBXLoader.js'),
                import('three/addons/utils/SkeletonUtils.js'),
                import('three/addons/environments/RoomEnvironment.js'),
                import(`/script/render2/battle-state.js?v=${V}`),
                import(`/script/render2/three-battle-renderer.js?v=${V}`),
                import(`/script/render2/synty-hero-assets.js?v=${V}`),
                import(`/script/render2/animation-library.js?v=${V}`),
                import(`/script/render2/synty-prop-packs.js?v=${V}`),
            ]);

            let heroAssets = null;
            try {
                heroAssets = new SyntyHeroAssets({ THREE, FBXLoader, SkeletonUtils });
                await heroAssets.load();
            }
            catch (error) {
                console.warn('Synty pack unavailable in harness:', error);
            }

            let animationLibrary = null;
            try {
                animationLibrary = new SyntyAnimationLibrary({ FBXLoader });
                await animationLibrary.load();
            }
            catch (error) {
                console.warn('Animation clips unavailable in harness:', error);
            }

            let propAssets = null;
            try {
                propAssets = new SyntyPropAssets({ THREE, FBXLoader, SkeletonUtils });
                await propAssets.load();
            }
            catch (error) {
                console.warn('Arena props unavailable in harness:', error);
            }

            const container = document.querySelector('#canvas-div');

            if (probe === 'anim') {
                // Clip-retargeting probe: idle / walk / attack / death side by side.
                const { getGladiatorAppearance } = await import('/script/render2/gladiator-appearance.js');
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x39424c);
                scene.add(new THREE.AmbientLight(0xffffff, 1.5));
                const sun = new THREE.DirectionalLight(0xffffff, 1.7);
                sun.position.set(-3, 6, -4);
                scene.add(sun);
                const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 60);
                camera.position.set(0, 1.6, -5.6);
                camera.lookAt(0, 1.0, 0);
                const gl = new THREE.WebGLRenderer({ antialias: true });
                gl.setPixelRatio(Math.min(devicePixelRatio, 2));
                gl.setSize(innerWidth, innerHeight);
                Object.assign(gl.domElement.style, { position: 'absolute', inset: '0' });
                container.appendChild(gl.domElement);
                container.closest('#canvas-container')?.classList.add('is-ready');
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x63523a }));
                floor.rotation.x = -Math.PI / 2;
                scene.add(floor);

                const mixers = [];
                const cases = [
                    ['idle', 'idle', 0],
                    ['walk', 'walkM', 0.35],
                    ['attack', 'meleeA', 0.4],
                    ['death', 'deathF', 1],
                ];
                cases.forEach(([label, clipKey, atTime], i) => {
                    const appearance = getGladiatorAppearance({ skin: '["male","light","cloth","sword","hair_brown"]', name: `A${i}`, user: 'P' });
                    const hero = heroAssets.createHero({ name: `A${i}`, user: 'P' }, appearance);
                    hero.object.position.set((i - 1.5) * 1.6, 0, 0);
                    scene.add(hero.object);
                    const mixer = new THREE.AnimationMixer(hero.object);
                    const clip = animationLibrary.get(clipKey);
                    const action = mixer.clipAction(clip);
                    action.setLoop(THREE.LoopOnce, 1);
                    action.clampWhenFinished = clipKey === 'death';
                    action.play();
                    action.time = clip.duration * atTime;
                    mixer.update(0);
                    mixers.push(mixer);
                    const el = document.createElement('span');
                    el.textContent = `${label} · ${clip.duration.toFixed(2)}s`;
                    Object.assign(el.style, {
                        position: 'absolute', left: `${50 + (i - 1.5) * 22}%`, top: '86%',
                        transform: 'translateX(-50%)', color: '#fff', font: '700 15px monospace', textShadow: '0 1px 3px #000',
                    });
                    document.body.appendChild(el);
                });
                const clock = new THREE.Clock();
                const tick = () => {
                    const delta = clock.getDelta();
                    mixers.forEach((mixer) => mixer.update(delta));
                    gl.render(scene, camera);
                    requestAnimationFrame(tick);
                };
                tick();
                const failed = animationLibrary.failedKeys;
                if (failed.length) console.warn('CLIPS_FAILED', failed.join(','));
                console.log('CLIP_INSPECT_IDLE', JSON.stringify(animationLibrary.inspect('idle')));
                status.textContent = `anim probe ready · ${animationLibrary.size} clips`;
                window.harnessComplete = { probe: 'anim', clips: animationLibrary.size, failed };
                return;
            }

            if (probe === 'rig') {
                // Raw bone-axis mapping: one hero per rotated axis plus the rest pose.
                const { getGladiatorAppearance } = await import('/script/render2/gladiator-appearance.js');
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x39424c);
                scene.add(new THREE.AmbientLight(0xffffff, 1.6));
                const sun = new THREE.DirectionalLight(0xffffff, 1.8);
                sun.position.set(-3, 6, -4);
                scene.add(sun);
                const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 60);
                camera.position.set(0, 1.7, -6.4);
                camera.lookAt(0, 1.0, 0);
                const gl = new THREE.WebGLRenderer({ antialias: true });
                gl.setPixelRatio(Math.min(devicePixelRatio, 2));
                gl.setSize(innerWidth, innerHeight);
                Object.assign(gl.domElement.style, { position: 'absolute', inset: '0' });
                container.appendChild(gl.domElement);
                container.closest('#canvas-container')?.classList.add('is-ready');
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x63523a }));
                floor.rotation.x = -Math.PI / 2;
                scene.add(floor);

                const stances = [
                    ['UpperLeg_L.x', { UpperLeg_L: { x: 0.9 } }],
                    ['UpperLeg_L.y', { UpperLeg_L: { y: 0.9 } }],
                    ['UpperLeg_L.z', { UpperLeg_L: { z: 0.9 } }],
                    ['LowerLeg_L.x', { LowerLeg_L: { x: 0.9 } }],
                    ['LowerLeg_L.z', { LowerLeg_L: { z: 0.9 } }],
                    ['Ankle_L.x', { Ankle_L: { x: 0.9 } }],
                    ['Hips.y', { Hips: { y: 0.5 } }],
                    ['Spine_02.x', { Spine_02: { x: 0.5 } }],
                ];
                const appearance = getGladiatorAppearance({ skin: '["male","light","cloth","sword","hair_brown"]', name: 'T', user: 'P' });
                const labels = [];
                const perRow = 4;
                stances.forEach(([name, bones], i) => {
                    const hero = heroAssets.createHero({ name: `T${i}`, user: 'P' }, appearance);
                    if (bones) hero.rig.applyPose({ bones });
                    const column = i % perRow;
                    const row = Math.floor(i / perRow);
                    hero.object.position.set((column - (perRow - 1) / 2) * 1.9, 0, row * 2.6);
                    scene.add(hero.object);
                    labels.push({ text: name, x: hero.object.position.x, z: hero.object.position.z });
                });
                const div = document.createElement('div');
                Object.assign(div.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 5 });
                document.body.appendChild(div);
                const renderProbe = () => {
                    gl.render(scene, camera);
                    labels.forEach((label) => {
                        if (label.el) return;
                        const v = new THREE.Vector3(label.x, 0.05, label.z).project(camera);
                        const el = document.createElement('span');
                        el.textContent = label.text;
                        Object.assign(el.style, {
                            position: 'absolute', left: `${(v.x * 0.5 + 0.5) * innerWidth}px`, top: `${(-v.y * 0.5 + 0.5) * innerHeight}px`,
                            transform: 'translateX(-50%)', color: '#fff', font: '700 15px monospace', textShadow: '0 1px 3px #000',
                        });
                        div.appendChild(el);
                        label.el = el;
                    });
                    requestAnimationFrame(renderProbe);
                };
                renderProbe();
                status.textContent = 'rig probe ready';
                window.harnessComplete = { probe: 'rig' };
                return;
            }

            const renderer = new ThreeBattleRenderer({ THREE, container, heroAssets, animationLibrary, propAssets, RoomEnvironment });
            window.threeBattleRenderer = renderer;

            if (probe) {
                // Heading probe: statues at 0/90/180/270 plus a northbound arrow.
                const statue = (id, head, x, skin) => ({
                    id, head, x, y: 12.5, skin,
                    name: `H${head}`, user: 'Probe',
                    hp: 100, maxhp: 100, ap: 60, maxap: 60,
                    lvl: 1, xp: 0, tonext: 100,
                    STR: 10, AGI: 10, INT: 10, as: 1, cs: 1, spd: 3,
                    lockedfor: 0, action: ACTIONS.none, code: '', message: '',
                    breakpoint: '', items: [1, -1], buffs: EMPTY_BUFFS(),
                });
                const probeSteps = [{
                    simtime: 0.1,
                    poison: 17.68,
                    glads: [
                        statue(0, 0, 4.5, '["female","tanned","plate_gold","sword","helm_iron","cape_red"]'),
                        statue(1, 90, 9.5, '["male","dark","leather","bow","hair_black"]'),
                        statue(2, 180, 14.5, '["female","light","cloth","staff","hair_blonde"]'),
                        statue(3, 270, 19.5, '["male","red_orc","metal","spear","helm_iron"]'),
                    ],
                    projectiles: [{ id: 1, type: 0, owner: 0, x: 12, y: 7, head: 0 }],
                }];
                renderer.update(expandSimulation(probeSteps)[0]);
                window.pausesim = true;
                status.textContent = 'probe ready';
                window.harnessComplete = { probe: true };
                return;
            }

            const simulation = buildSimulation();
            const steps = expandSimulation(simulation);
            let index = 0;
            window.pausesim = false;
            window.harnessSteps = steps;
            Object.defineProperty(window, 'harnessIndex', { get: () => index });

            if (Number.isFinite(freezeAt)) {
                // Jump straight to the requested simtime and hold for inspection.
                const target = Math.min(steps.length - 1, Math.round(freezeAt / 0.1));
                for (let fast = 0; fast <= target; fast += 1) renderer.update(steps[fast]);
                window.pausesim = true;
                status.textContent = `frozen at t=${steps[target].simtime.toFixed(1)}s`;
                window.harnessComplete = { frozen: true, simtime: steps[target].simtime };
                return;
            }

            await new Promise((resolve) => {
                const timer = setInterval(() => {
                    if (index >= steps.length) {
                        clearInterval(timer);
                        resolve();
                        return;
                    }
                    renderer.update(steps[index]);
                    index += 1;
                    status.textContent = `frame ${index}/${steps.length} · t=${steps[index - 1].simtime.toFixed(1)}s`;
                }, 100);
            });

            // Settled-fidelity probe: paused views must sit exactly on engine coordinates.
            window.pausesim = true;
            await new Promise((resolve) => setTimeout(resolve, 350));
            const snapshot = renderer.getDebugSnapshot();
            const last = steps.at(-1);
            const report = snapshot.gladiators.map((view, i) => {
                const engineX = Number(last.glads[i].x);
                const engineY = Number(last.glads[i].y);
                return {
                    id: view.id,
                    positionError: Number(Math.hypot(view.worldX - (engineX - 12.5), view.worldZ - (engineY - 12.5)).toFixed(4)),
                };
            });
            console.log('HARNESS_FIDELITY', JSON.stringify(report));
            status.textContent = `done · maxErr=${Math.max(...report.map((r) => r.positionError))}`;
            window.harnessComplete = { report, framesPlayed: steps.length };
        }

        main().catch((error) => {
            console.error('HARNESS_FAILED', error);
            const badge = document.querySelector('#harness-status');
            if (badge) badge.textContent = `FAILED: ${error.message}`;
        });
    </script>
</body>
</html>
