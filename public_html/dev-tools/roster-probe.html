<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<title>roster probe</title>
<style>body{margin:0;background:#15191d}canvas{display:block}</style>
<script src="script/battle-renderer-preference.js"></script>
<link rel='stylesheet' href="css/playback.css"/>
<link rel='stylesheet' href="css/playback-render2.css"/>
<style>
    body { margin: 0; background: #15191d; }
    #frame { width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
}
</script>
</head>
<body class="renderer-three">
<div id="frame">
    <div id="canvas-container">
        <div id="canvas-div"></div>
    </div>
</div>
<script>
window.prefs = { bars: true, speech: false, text: false, fps: true, crowd: 0.5, sound: { music: 0, sfx: 0 } };
window.pausesim = true;
window.stepIncrement = 1;
window.update_ui = () => {};
window.sprite = [];
window.gladArray = [];
</script>
<script type="module">
const ACTIONS = { fireball: 0, teleport: 1, charge: 2, block: 3, assassinate: 4, ambush: 5, melee: 6, ranged: 7, movement: 8, waiting: 9, none: 10, potion: 11 };
const EMPTY_BUFFS = () => ({
    burn: { value: 0, timeleft: 0 },
    movement: { value: 0, timeleft: 0 },
    resist: { value: 0, timeleft: 0 },
    invisible: { value: 0, timeleft: 0 },
    stun: { value: 0, timeleft: 0 },
});

// Real rosters pulled from the live database.
const ROSTER = [
    { id: 0, name: 'Kaiser', user: 'Probe', skin: '["male","male-light","default_ears","head_none","ranged_none","bangslong_black","beard_black","male_longsleeve_black","male_plate-chest","male_pants_black","male_metal-feet","shoulder_none","hands_none","cape_black","belt_none","male_warhammer","male_shield_9","eyes_brown","cape_black_behind"]' },
    { id: 1, name: 'DEV SrBlue', user: 'Probe', skin: '["male","facial_none","head_none","armor_none","bangslong_blue2","male_metal-gauntlet","cape_none","male-tanned2","male_oversize_6","male_gold-shoulder","male_belt_leather","male_plate-legs","male_metal-feet","male_longsleeve_blue","shield_none","ranged_none"]' },
    { id: 2, name: 'Arcaness', user: 'Probe', skin: '["facial_none","head_none","hands_none","shield_none","female","female_sleeveless_pink","female_oversize_rapier","arcoreal","female_plate-chest","female_pants_red","female_shoes_black","female_belt_leather","shoulder_none","cape_black","female-orc","ponytail_blue2","arrows","cape_black_behind"]' },
    { id: 3, name: 'O Mestre dos Magos', user: 'Probe', skin: '["facial_none","hands_none","melee_none","ranged_none","shield_none","male","eyes_yellow","male-light","armor_none","belt_none","male_longsleeve_red","male_pants_red","male_shoes_black","cape_red","shoulder_none","male_cloth-hood"]' },
    { id: 4, name: 'Malenia', user: 'Probe', skin: '["facial_none","female","female-light","eyes_purple","elvenears_light","female_tightdress_red","female_shoes_brown","female_wizard-hat","shoulder_none","xlong_white-blonde","female_belt_white-cloth","hands_none","cape_lavender","arcoreal","female_oversize_7","female_shield_1","cape_lavender_behind","arrows"]' },
];

// Spawn positions spread around center; melee pair adjacent, archers apart.
const HOME = [
    { x: 10.5, y: 12.5, head: 0 },
    { x: 14.5, y: 12.5, head: 180 },
    { x: 12.5, y: 6.5, head: 180 },
    { x: 12.5, y: 18.5, head: 0 },
    { x: 5.5, y: 6.5, head: 135 },
];

function buildFrames() {
    const frames = [];
    let nextId = 1;
    let projectiles = [];
    for (let step = 0; step < 200; step += 1) {
        const time = Number((step * 0.1).toFixed(1));
        const glads = ROSTER.map((roster, index) => {
            const home = HOME[index];
            const glad = {
                id: roster.id, name: roster.name, user: roster.user, skin: roster.skin,
                x: home.x, y: home.y, head: home.head,
                hp: 100, maxhp: 100, ap: 60, maxap: 60,
                lvl: 1, xp: 0, tonext: 100,
                STR: 10, AGI: 10, INT: 10, as: 1, cs: 1, spd: 3,
                lockedfor: 0, action: ACTIONS.waiting, code: '', message: '',
                breakpoint: '', items: [1, -1], buffs: EMPTY_BUFFS(),
            };
            // Melee pair trades swings on offset rhythms.
            if (index <= 1) {
                const phase = (time + index * 0.8) % 2.4;
                if (phase < 1.0) glad.action = ACTIONS.melee;
                else if (phase < 1.8) glad.action = ACTIONS.movement;
                if (glad.action === ACTIONS.movement) {
                    glad.x = home.x + Math.sin(time * 1.3 + index) * 0.8;
                    glad.y = home.y + Math.cos(time * 1.1 + index) * 0.8;
                }
                glad.head = index === 0 ? 0 : 180;
            }
            // Archers shoot on a cadence; slight repositioning between shots.
            if (index >= 2) {
                const phase = (time + index * 0.5) % 3;
                glad.action = phase < 0.9 ? ACTIONS.ranged : ACTIONS.waiting;
                glad.head = index === 2 ? 180 : 0;
            }
            return glad;
        });

        // Arrow streams from both archers plus one fireball from the mage.
        if (step % 14 === 3) {
            projectiles.push({ id: nextId++, type: 0, owner: 2, x: 12.5, y: 6.5, head: 180 });
            projectiles.push({ id: nextId++, type: 0, owner: 4, x: 5.5, y: 6.5, head: 90 });
        }
        if (step === 60) projectiles.push({ id: nextId++, type: 1, owner: 3, x: 12.5, y: 18.5, head: 0 });
        projectiles = projectiles.map((projectile) => {
            const speed = projectile.type === 1 ? 6 : 9;
            const radians = projectile.head * Math.PI / 180;
            return {
                ...projectile,
                x: projectile.x + Math.sin(radians) * speed * 0.1,
                y: projectile.y - Math.cos(radians) * speed * 0.1,
            };
        }).filter((projectile) => Math.hypot(projectile.x - 12.5, projectile.y - 12.5) < 11.5);

        frames.push({ simtime: time, poison: 17.68, glads, projectiles: projectiles.map(({ owner, ...rest }) => rest) });
    }
    return frames;
}

const status = document.createElement('div');
status.id = 'probe-status';
Object.assign(status.style, { position: 'fixed', top: '8px', right: '8px', zIndex: 99, color: '#fff', font: '600 13px monospace', background: 'rgb(0 0 0 / .55)', padding: '6px 10px', borderRadius: '8px' });
document.body.appendChild(status);

const params = new URLSearchParams(location.search);
const freezeAt = params.get('t') === null ? NaN : Number(params.get('t'));

const [THREE, { FBXLoader }, SkeletonUtils, { RoomEnvironment }, { expandSimulation }, { ThreeBattleRenderer }, { SyntyHeroAssets }, { SyntyAnimationLibrary }, { SyntyPropAssets }] = await Promise.all([
    import('three'),
    import('three/addons/loaders/FBXLoader.js'),
    import('three/addons/utils/SkeletonUtils.js'),
    import('three/addons/environments/RoomEnvironment.js'),
    import('/script/render2/battle-state.js'),
    import(`/script/render2/three-battle-renderer.js?v=${Date.now()}`),
    import(`/script/render2/synty-hero-assets.js?v=${Date.now()}`),
    import(`/script/render2/animation-library.js?v=${Date.now()}`),
    import(`/script/render2/synty-prop-packs.js?v=${Date.now()}`),
]);

const heroAssets = new SyntyHeroAssets({ THREE, FBXLoader, SkeletonUtils });
await heroAssets.load();
const animationLibrary = new SyntyAnimationLibrary({ FBXLoader });
await animationLibrary.load();
const propAssets = new SyntyPropAssets({ THREE, FBXLoader, SkeletonUtils });
await propAssets.load();

const container = document.querySelector('#canvas-div');
const renderer = new ThreeBattleRenderer({ THREE, container, heroAssets, animationLibrary, propAssets, RoomEnvironment });
window.threeBattleRenderer = renderer;

// Expose per-fighter weapon class for assertions.
window.rosterProbe = ROSTER.map((roster) => {
    const appearanceMod = { getGladiatorAppearance: null };
    return { name: roster.name, skin: roster.skin };
});

const steps = expandSimulation(buildFrames());
window.harnessSteps = steps;
Object.defineProperty(window, 'harnessIndex', { get: () => steps.length });

if (Number.isFinite(freezeAt)) {
    const target = Math.min(steps.length - 1, Math.round(freezeAt / 0.1));
    for (let fast = 0; fast <= target; fast += 1) renderer.update(steps[fast]);
    window.pausesim = true;
    status.textContent = `frozen at t=${steps[target].simtime.toFixed(1)}s`;
}
else {
    let index = 0;
    window.pausesim = false;
    await new Promise((resolve) => {
        const timer = setInterval(() => {
            if (index >= steps.length) { clearInterval(timer); resolve(); return; }
            renderer.update(steps[index]);
            index += 1;
            status.textContent = `frame ${index}/${steps.length}`;
        }, 100);
    });
    status.textContent = 'done';
}
window.probeReady = true;
</script>
</body>
</html>
